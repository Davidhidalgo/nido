<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-labelledby="title desc">
<title id="title">Símbolos de botones del NOTE4</title><desc id="desc">Propuesta a 400 por 300. Pareja de rectángulos para los laterales, resaltando el superior o inferior. Círculo para el frontal. Contorno grueso y trama en el botón indicado.</desc>
<rect width="400" height="300" fill="white"/>
<defs><pattern id="dots" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="black"/></pattern></defs>
<text x="18" y="23" font-family="monospace" font-size="11">botones · propuesta</text>
<rect x="32.0" y="40.0" width="4" height="8" rx="1" fill="url(#dots)" stroke="black" stroke-width="2"/>
<rect x="31.5" y="51.5" width="5" height="9" rx="1" fill="white" stroke="black" stroke-width="1"/>
<text x="53" y="52" font-family="monospace" font-size="11">superior</text>
<rect x="161.5" y="39.5" width="5" height="9" rx="1" fill="white" stroke="black" stroke-width="1"/>
<rect x="162.0" y="52.0" width="4" height="8" rx="1" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="183" y="52" font-family="monospace" font-size="11">inferior</text>
<ellipse cx="295.0" cy="50.0" rx="9.0" ry="9.0" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="313" y="52" font-family="monospace" font-size="11">frontal</text>
<rect x="20.5" y="83.5" width="359" height="145" rx="0" fill="white" stroke="black" stroke-width="1"/>
<text x="34" y="104" font-family="monospace" font-size="11">pregunta · ejemplo ficticio</text>
<text x="34" y="130" font-family="monospace" font-size="14">¿Instalar la nueva versión?</text>
<rect x="30.5" y="145.5" width="339" height="27" rx="3" fill="white" stroke="black" stroke-width="1"/>
<rect x="43.0" y="149.0" width="4" height="8" rx="1" fill="url(#dots)" stroke="black" stroke-width="2"/>
<rect x="42.5" y="160.5" width="5" height="9" rx="1" fill="white" stroke="black" stroke-width="1"/>
<text x="67" y="165" font-family="monospace" font-size="14">Actualizar</text>
<rect x="30.5" y="179.5" width="339" height="27" rx="3" fill="white" stroke="black" stroke-width="1"/>
<rect x="42.5" y="182.5" width="5" height="9" rx="1" fill="white" stroke="black" stroke-width="1"/>
<rect x="43.0" y="195.0" width="4" height="8" rx="1" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="67" y="199" font-family="monospace" font-size="14">Configurar</text>
<ellipse cx="37.0" cy="254.0" rx="9.0" ry="9.0" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="58" y="259" font-family="monospace" font-size="14">Cerrar</text>
<ellipse cx="188.0" cy="254.0" rx="9.0" ry="9.0" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="206" y="260" font-family="monospace" font-size="14">+</text>
<rect x="236.5" y="243.5" width="5" height="9" rx="1" fill="white" stroke="black" stroke-width="1"/>
<rect x="237.0" y="256.0" width="4" height="8" rx="1" fill="url(#dots)" stroke="black" stroke-width="2"/>
<text x="263" y="256" font-family="monospace" font-size="11">mantener 5 s</text>
<text x="18" y="290" font-family="monospace" font-size="11">trama + borde grueso = botón que pulsar</text>
